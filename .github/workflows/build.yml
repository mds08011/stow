name: Build check

# Compile-only verification of both build types. Does not tag, release, sign, or
# publish an APK — use "Build and Release APK" (release.yml) for that.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      # No signing secrets here by design, so this produces an UNSIGNED APK. The point
      # is to prove the release path builds at all — release.yml is the only place that
      # signs and publishes.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --console=plain
